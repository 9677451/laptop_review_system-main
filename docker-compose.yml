version: '3.8'

services:
  backend:
    build: ./backend
    container_name: laptop_backend
    restart: always
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-9677451}
      - DB_NAME=${DB_NAME:-laptop_review_db}
    # 如果使用外部 RDS，可以注释掉下面的 depends_on
    depends_on:
      - db
    volumes:
      - ./backend/backups:/app/backups

  db:
    image: mysql:8.0
    container_name: laptop_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 9677451
      MYSQL_DATABASE: laptop_review_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  nginx:
    image: nginx:alpine
    container_name: laptop_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  db_data:
