version: '3.8'

services:
  backend:
    build: ./backend
    container_name: laptop_backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/backups:/app/backups

  nginx:
    image: nginx:alpine
    container_name: laptop_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
